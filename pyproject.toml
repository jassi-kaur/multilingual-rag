[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multilingual-rag"
version = "0.1.0"
description = "A multilingual Retrieval-Augmented Generation system for cross-lingual document retrieval."
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests that are slow to run (e.g. tests loading ML models)",
]
